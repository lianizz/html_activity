<!DOCTYPE html>
<html>
<body bgcolor="#BDB5D5">

<h1>Tech Explorers Club Registration Form</h1>

<form action="https://lianizz.github.io/html_activity/confirmation.html" method="post">
<fieldset>

<label for="number">Contact Number</label><br>
<input type="text" id="number" name="lname" placeholder="09XXXXXXXXX"><br><br>

<input type="radio"name="Male">Male<br>

<option value="...Select your Level...">...Select your Level... 
</option>
</select>


</fieldset>

<fieldset>

<input type="checkbox"name="Female">Designs<br>
<input type="checkbox"name="Female">Robotics<br><br>

<option value="New Member">New Member<br><br>
</option>
</select>
<br>
<br>

<textarea name="feedback" rows="5" cols="30">write your message here...</textarea>

</fieldset> <br>
<input type="submit" value="Submit">

</form>

</html>
